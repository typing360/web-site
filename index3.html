<!DOCTYPE html>
<html lang="en">
<head>
    <title>Document</title>
    <style>
        body {
            background-color:greenyellow ;
            color: blue;
            
        }

        .calculator{
            background-color: brown;
            margin: auto;
            padding: 10px;
            font-family: Arial, Helvetica, sans-serif;
            border: 10px;
            width: 300px;
            height: 400px;
            border-radius: 10px;
        }
        input{
            width: 200px;
            height: auto;
        }
        button{
            background-color: aqua;
            
        }
        
    </style>
</head>
<body>
    <div class="calculator">
        <h2>simple calculator</h2>

        <input type="number" name="" id="num1" placeholder="enter 1st number"><br>
        <input type="number" name="" id="num2" placeholder="enter 2nd number"><br><br>

        <button onclick="addnumbers()">plus</button>
        <button onclick="substractnumbers()">minus</button>
        <button onclick="multiplynumbers()">multiplication</button>
        <button onclick="dividenumbers()">division</button>
        <button onclick="clearnumbers()">C</button>

        <h3 id="result">Result is</h3>

        <script>
            function addnumbers() {
                let num1= Number(Document.getElementById('num1').value);
                let num2= Number(Document.getElementById('num2').value);
             

                document.getElementById('result').innerHTML="Result is"+(num1+num2);
                
            }

            function substractnumbers() {
                let num1= Number(Document.getElementById('num1').value);
                let num2= Number(Document.getElementById('num2').value);

                document.getElementById("result").innerHTML="Result is"+(num1-num2);

            
            }

            function multiplynumbers() {
                let num1= Number(Document.getElementById('num1').value);
                let num2= Number(Document.getElementById('num2').value);

                document.getElementById("result").innerHTML="Result is"+(num1*num2);


            }

            function dividenumbers() {
                let num2= Number(Document.getElementById('num2').value);

                document.getElementById("result").innerHTML="Result is"+(num1/num2);
            
            }

            function clearnumbers() {
                Document.getElementById('num1').value="";
                Document.getElementById('num2').value="";

                document.getElementById("result").innerHTML="Result is";

            }    
        </script>



    </div>
</body>
</html>
