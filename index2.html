<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Simple Calculator</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 50px;
        }
        .calculator-box {
            max-width: 300px;
            padding: 20px;
            border: 1px solid #d1c626;
            border-radius: 8px;
            background-color: #cdee11;
        }
        input {
            width: 90%;
            padding: 8px;
            margin: 8px 0;
            font-size: 16px;
        }
        button {
            padding: 10px 15px;
            font-size: 16px;
            margin-right: 5px;
            cursor: pointer;
        }
        #result {
            margin-top: 19px;
            font-weight: bold;
            font-size: 18px;
            color:#FFF;
        }
    </style>
</head>
<body>

<div class="calculator-box">
    <h3>Simple Calculator</h3>
    
    <input type="number" id="num1" placeholder="Enter first number">
    <input type="number" id="num2" placeholder="Enter second number">
    
    <br><br>
   
    <button onclick="calculateSum()">Sum</button>
    <button onclick="calculateMinus()">Minus</button>

    <button onclick="clearFields()">Clear</button>
    
 
    <div id="result">Result: </div>
</div>

<script>
   
    function calculateSum() {
        
        const value1 = document.getElementById("num1").value;
        const value2 = document.getElementById("num2").value;
        
        
        const number1 = Number(value1);
        const number2 = Number(value2);
        
        if (value1 === "" || value2 === "") {
            document.getElementById("result").innerText = "Result: Please enter both numbers.";
            return;
        }
        
        const sum = number1 + number2;
        
        document.getElementById("result").innerText = "Result: " + sum;
    }

    function clearFields() {
        document.getElementById("num1").value = "";
        document.getElementById("num2").value = "";
        document.getElementById("result").innerText = "Result: ";
    }

    function calculateMinus() {
        
        const value1 = document.getElementById("num1").value;
        const value2 = document.getElementById("num2").value;
        
        
        const number1 = Number(value1);
        const number2 = Number(value2);
        
        if (value1 === "" || value2 === "") {
            document.getElementById("result").innerText = "Result: Please enter both numbers.";
            return;
        }
        
        const minus = number1 - number2;
        
        document.getElementById("result").innerText = "Result: " + minus;
    }

    function clearFields() {
        document.getElementById("num1").value = "";
        document.getElementById("num2").value = "";
        document.getElementById("result").innerText = "Result: ";
    }
</script>

</body>
</html>
